<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arabia War</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#07111f;
    color:#fff;
    min-height:100vh;
}

button,input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* ================= HEADER ================= */

header{
    height:65px;
    background:linear-gradient(90deg,#091827,#102b45);
    border-bottom:1px solid #c89b3c;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:21px;
    font-weight:bold;
    color:#f5c75b;
}

.version{
    font-size:11px;
    color:#9baec2;
    margin-top:3px;
}

.languages{
    display:flex;
    gap:5px;
}

.lang-btn{
    border:1px solid #53677b;
    background:#12263a;
    color:#dce8f3;
    padding:7px 9px;
    border-radius:8px;
    font-size:12px;
}

.lang-btn.active{
    background:#d39b32;
    color:#101010;
    border-color:#f4c65c;
}

/* ================= SCREENS ================= */

.screen{
    display:none;
    min-height:calc(100vh - 65px);
}

.screen.active{
    display:block;
}

/* ================= WELCOME ================= */

.welcome{
    min-height:calc(100vh - 65px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
    background:
        radial-gradient(circle at 50% 30%,rgba(201,153,54,.15),transparent 35%),
        linear-gradient(#071321,#030911);
}

.welcome-box{
    max-width:650px;
    width:100%;
    text-align:center;
    padding:45px 25px;
    border:1px solid #6f5423;
    border-radius:25px;
    background:rgba(10,25,40,.95);
    box-shadow:0 20px 80px rgba(0,0,0,.5);
}

.big-logo{
    font-size:70px;
    margin-bottom:15px;
}

.welcome h1{
    font-size:42px;
    color:#f1c45a;
    margin-bottom:15px;
}

.welcome p{
    color:#aebdca;
    line-height:2;
    margin-bottom:28px;
}

/* ================= BUTTONS ================= */

.main-btn{
    border:none;
    border-radius:12px;
    padding:14px 28px;
    background:linear-gradient(135deg,#d69d35,#f0c45d);
    color:#17110a;
    font-weight:bold;
    font-size:16px;
    box-shadow:0 7px 20px rgba(214,157,53,.25);
}

.main-btn:hover{
    transform:translateY(-2px);
}

.secondary-btn{
    background:#14283b;
    border:1px solid #536b81;
    color:#fff;
    padding:10px 17px;
    border-radius:10px;
}

/* ================= PROFILE ================= */

.profile-wrap{
    max-width:1200px;
    margin:auto;
    padding:30px 18px;
}

.profile-title{
    text-align:center;
    color:#f1c45a;
    margin-bottom:25px;
}

.name-box{
    background:#0c1d2e;
    border:1px solid #27445d;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
}

.name-box label{
    display:block;
    margin-bottom:10px;
    color:#d9e5ee;
}

.name-input{
    width:100%;
    padding:13px;
    border-radius:9px;
    border:1px solid #536c82;
    background:#071521;
    color:#fff;
    outline:none;
}

.countries{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
}

.country{
    background:linear-gradient(145deg,#10263a,#0b1b2a);
    border:1px solid #28445c;
    border-radius:14px;
    padding:15px;
    transition:.2s;
}

.country:hover{
    transform:translateY(-3px);
    border-color:#c89b3c;
}

.country.selected{
    border:2px solid #e4b94e;
    background:linear-gradient(145deg,#2c2414,#14283b);
}

.flag{
    font-size:32px;
}

.country-name{
    font-weight:bold;
    margin:8px 0;
}

.country-role{
    color:#9db0c0;
    font-size:12px;
    margin-bottom:10px;
}

.country-stats{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:#d3a94d;
}

.selected-box{
    margin:20px 0;
    background:#0d2032;
    border:1px solid #6a5225;
    border-radius:14px;
    padding:18px;
}

/* ================= GAME ================= */

#gameScreen{
    background:#050d16;
}

.game-top{
    background:#0a1725;
    border-bottom:1px solid #273e54;
    padding:12px 15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    position:sticky;
    top:65px;
    z-index:900;
}

.player-title{
    color:#f0c45d;
    font-weight:bold;
}

.game-nav{
    display:flex;
    gap:5px;
    overflow-x:auto;
}

.nav-btn{
    white-space:nowrap;
    background:#10253a;
    color:#b9cad8;
    border:1px solid #304b61;
    border-radius:8px;
    padding:8px 11px;
}

.nav-btn.active{
    background:#c99532;
    color:#101010;
}

/* ================= GAME CONTENT ================= */

.game-content{
    max-width:1400px;
    margin:auto;
    padding:15px;
}

.game-panel{
    display:none;
}

.game-panel.active{
    display:block;
}

/* ================= KINGDOM SCENE ================= */

.kingdom-scene{
    --sky1:#143957;
    --sky2:#72a7c4;
    --ground:#75603b;
    --wall:#c7a16c;
    --wall2:#8d6b3e;
    --accent:#e0ad43;

    height:500px;
    position:relative;
    overflow:hidden;
    border-radius:20px;
    border:2px solid #705525;
    background:linear-gradient(var(--sky1),var(--sky2) 62%,var(--ground) 62%);
    box-shadow:0 15px 50px rgba(0,0,0,.45);
}

/* sky */

.sun{
    position:absolute;
    width:70px;
    height:70px;
    border-radius:50%;
    background:#ffe38a;
    box-shadow:0 0 45px #ffe38a;
    top:45px;
    right:12%;
}

.cloud{
    position:absolute;
    font-size:45px;
    opacity:.5;
}

.cloud.one{
    top:60px;
    left:15%;
}

.cloud.two{
    top:120px;
    left:55%;
}

/* mountains */

.mountains{
    position:absolute;
    bottom:185px;
    left:0;
    width:100%;
    height:170px;
    background:
        linear-gradient(135deg,transparent 50%,rgba(32,45,53,.8) 50%) 0 0/230px 170px,
        linear-gradient(225deg,transparent 50%,rgba(45,57,60,.7) 50%)
