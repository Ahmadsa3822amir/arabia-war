<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arabia War</title>

  <style>
    body {
      margin: 0;
      background: #101820;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 15px;
    }

    h1 {
      color: #f0b24a;
    }

    .box {
      max-width: 500px;
      margin: 30px auto;
      padding: 25px;
      background: #182733;
      border-radius: 15px;
    }

    button {
      background: #d89b32;
      color: white;
      border: 0;
      padding: 12px 20px;
      margin: 5px;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <h1>⚔️ Arabia War</h1>

  <div class="box">

    <h2>🌍 Choose Your Language</h2>

    <button onclick="setLanguage('en')">
      🇬🇧 English
    </button>

    <button onclick="setLanguage('ar')">
      🇸🇦 العربية
    </button>

    <button onclick="setLanguage('fa')">
      🇮🇷 فارسی
    </button>

    <p id="message">Game is ready.</p>

  </div>

<script>

function setLanguage(language) {

  const message = document.getElementById("message");

  if (language === "en") {
    document.documentElement.lang = "en";
    document.documentElement.dir = "ltr";
    message.innerText = "Game is ready.";
  }

  if (language === "ar") {
    document.documentElement.lang = "ar";
    document.documentElement.dir = "rtl";
    message.innerText = "اللعبة جاهزة.";
  }

  if (language === "fa") {
    document.documentElement.lang = "fa";
    document.documentElement.dir = "rtl";
    message.innerText = "بازی آماده است.";
  }

}

</script>

</body>
</html>
