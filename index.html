<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arabia War</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0d151b;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 20px 15px;
      background: #121f28;
      border-bottom: 1px solid #263945;
    }

    header h1 {
      margin: 0;
      color: #f0b24a;
      font-size: 32px;
    }

    header p {
      color: #aebbc3;
      margin: 8px 0;
    }

    .language-box {
      margin-top: 12px;
    }

    .language-box button {
      background: #263945;
      color: white;
      border: 1px solid #405563;
      padding: 8px 12px;
      border-radius: 8px;
      margin: 3px;
      cursor: pointer;
    }

    .language-box button:hover {
      border-color: #f0b24a;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .welcome {
      text-align: center;
      background: #172630;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .welcome h2 {
      margin-top: 0;
      color: #f0b24a;
    }

    .countries {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    .country {
      background: #182832;
      border: 1px solid #2b414e;
      border-radius: 14px;
      padding: 16px 10px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .country:hover {
      transform: translateY(-3px);
      border-color: #f0b24a;
      background: #213642;
    }

    .flag {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .country-name {
      font-size: 17px;
      font-weight: bold;
    }

    .role {
      color: #aebbc3;
      font-size: 12px;
      margin-top: 6px;
    }

    .stats {
      display: none;
      background: #172630;
      border-radius: 15px;
      padding: 20px;
      margin-top: 20px;
      border: 1px solid #3a4e5a;
    }
