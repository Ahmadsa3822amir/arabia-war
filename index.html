<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arabia War</title>

  <style>
    body {
      margin: 0;
      background: #101820;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      color: #f0b24a;
      font-size: 36px;
    }

    .box {
      max-width: 500px;
      margin: 30px auto;
      padding: 25px;
      background: #182733;
      border-radius: 15px;
    }

    button {
      background: #d89b32;
      color: white;
      border: none;
      padding: 14px 25px;
      border-radius: 10px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <h1>⚔️ Arabia War</h1>

  <div class="box">
    <h2>بازی با موفقیت اجرا شد ✅</h2>
    <p>نسخه آزمایشی 0.1</p>

    <button onclick="startGame()">
      شروع بازی
    </button>

    <p id="message"></p>
  </div>

  <script>
    function startGame() {
      document.getElementById("message").innerHTML =
        "🌍 آماده‌ایم تا نقشه بازی را بسازیم!";
    }
  </script>

</body>
</html>
